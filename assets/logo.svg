<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Stillmere</title>
  <!-- Background: the launcher colour. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#2B2118"/>
  <!-- A low sun, setting behind the shelter. -->
  <circle cx="256" cy="172" r="92" fill="#E8B04A"/>
  <!-- The shelter: a dome with a door, the first thing a colony needs. -->
  <path d="M136 300 A120 120 0 0 1 376 300 Z" fill="#C98A4B"/>
  <path d="M226 300 A30 30 0 0 1 286 300 Z" fill="#15130F"/>
  <!-- Ground. -->
  <rect x="96" y="300" width="320" height="26" fill="#4E8A3A"/>
  <!-- Still water: three ripples that narrow away from the colony. -->
  <rect x="150" y="354" width="212" height="12" rx="6" fill="#E8B04A"/>
  <rect x="190" y="386" width="132" height="10" rx="5" fill="#E8B04A" fill-opacity="0.7"/>
  <rect x="222" y="414" width="68" height="8" rx="4" fill="#E8B04A" fill-opacity="0.45"/>
  <!-- Wordmark. -->
  <text x="256" y="478" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="46" letter-spacing="8" fill="#E8B04A">STILLMERE</text>
</svg>
